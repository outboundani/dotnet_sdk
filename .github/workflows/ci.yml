name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # All three SDK bands are installed so `dotnet test` can actually *execute* the net8.0 and
      # net9.0 test assemblies. A 10.0 SDK alone can build them but not run them. global.json
      # still governs which SDK does the building.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      # MinVer derives the version from git history, so a shallow clone would produce 0.0.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet pack -c Release --no-restore

      - name: Verify package contents
        run: |
          set -euo pipefail
          pkg=$(ls artifacts/package/release/OutboundIQ.Client.*.nupkg | grep -v '\.snupkg$')
          echo "Inspecting $pkg"
          unzip -l "$pkg"

          for tfm in net8.0 net9.0 net10.0; do
            unzip -l "$pkg" | grep -q "lib/$tfm/OutboundIQ.Client.dll" \
              || { echo "::error::missing lib/$tfm/OutboundIQ.Client.dll"; exit 1; }
            unzip -l "$pkg" | grep -q "lib/$tfm/OutboundIQ.Client.xml" \
              || { echo "::error::missing XML docs for $tfm"; exit 1; }
          done

          unzip -l "$pkg" | grep -q "README.md" || { echo "::error::README.md not packed"; exit 1; }
          ls artifacts/package/release/*.snupkg >/dev/null || { echo "::error::no symbol package"; exit 1; }

          nuspec=$(unzip -p "$pkg" OutboundIQ.Client.nuspec)
          echo "$nuspec"
          grep -q '<license type="expression">MIT</license>' <<<"$nuspec" \
            || { echo "::error::license expression missing"; exit 1; }
          # SourceLink stamps the commit. A missing one means fetch-depth or
          # ContinuousIntegrationBuild is wrong, and the package would not be debuggable.
          grep -q 'commit="[0-9a-f]\{40\}"' <<<"$nuspec" \
            || { echo "::error::repository commit missing; SourceLink did not run"; exit 1; }

      - name: Validate package metadata
        run: |
          dotnet tool install --global Meziantou.Framework.NuGetPackageValidation.Tool
          meziantou.validate-nuget-package artifacts/package/release/*.nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/package/release/*
